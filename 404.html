<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面走丢了 · 近取</title>
<link rel="icon" href="assets/img/mascot.png" />
<style>
  :root {
    --cream: #fffaf1;
    --ink: #241d18;
    --ink-2: #4c4037;
    --muted: #8b7b6c;
    --line: #f0e2d1;
    --coral: #e8663a;
    --coral-deep: #c74a20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(1200px 700px at 8% -5%, #ffe6c9 0%, rgba(255, 230, 201, 0) 62%),
      radial-gradient(900px 620px at 96% 6%, #ffdcd2 0%, rgba(255, 220, 210, 0) 60%),
      var(--cream);
    color: var(--ink);
    font-family: "Inter", "Segoe UI Variable", "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.7;
  }
  .box {
    width: 100%;
    max-width: 460px;
    text-align: center;
    background: rgba(255, 255, 255, .82);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 28px;
    box-shadow: 0 18px 40px -24px rgba(120, 74, 38, .3);
  }
  .box img { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px; display: block; }
  .code { font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--coral-deep); font-weight: 700; margin-bottom: 10px; }
  h1 { font-size: 26px; margin: 0 0 10px; line-height: 1.3; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 26px;
    padding: 13px 26px;
    border-radius: 999px;
    background: linear-gradient(135deg, #f07a46, var(--coral) 55%, #d94f28);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    border: 1px solid rgba(199, 74, 32, .35);
    box-shadow: 0 14px 28px -14px rgba(200, 70, 30, .6);
  }
</style>
</head>
<body>
  <div class="box">
    <img src="assets/img/mascot.png" alt="近取图标" width="72" height="72" />
    <div class="code">404</div>
    <h1>这一页被拖到别处去了</h1>
    <p>地址可能输错，或者页面已经挪走了。</p>
    <a class="btn" href="index.html">回首页</a>
  </div>
</body>
</html>
